<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root { --bg:#0e0f12; --card:#1a1c21; --line:#2a2d34; --text:#f2f2f4; --muted:#9a9ca3; --accent:#ffcf5a; }
  * { box-sizing:border-box; }
  body { margin:0; width:300px; background:var(--bg); color:var(--text); font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  .wrap { padding:16px; display:flex; flex-direction:column; gap:12px; }
  h1 { font-size:16px; margin:0; }
  p { margin:0; color:var(--muted); }
  input { width:100%; background:var(--card); color:var(--text); border:1px solid var(--line); border-radius:10px; padding:10px 12px; font:inherit; }
  #code { text-transform:uppercase; letter-spacing:0.1em; font-weight:600; }
  button { font:inherit; font-weight:600; border:0; border-radius:10px; padding:10px 14px; cursor:pointer; background:var(--accent); color:#16130a; }
  button.ghost { background:var(--card); color:var(--text); border:1px solid var(--line); }
  .row { display:flex; gap:8px; align-items:center; }
  .row > * { flex:1; }
  .status { display:flex; align-items:center; gap:8px; }
  .dot { width:8px; height:8px; border-radius:50%; background:#f87171; flex:none; }
  .dot.on { background:#4ade80; }
  .roomcode { font-size:28px; font-weight:700; letter-spacing:0.12em; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; display:flex; flex-direction:column; gap:8px; }
  .nudge { display:flex; align-items:center; gap:8px; }
  .nudge button { flex:none; width:48px; padding:10px 0; }
  .dot.mid { background:#ffcf5a; }
  .nudge b { flex:1; text-align:center; font-size:16px; white-space:nowrap; }
  details summary { color:var(--muted); cursor:pointer; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Watch Together</h1>

  <section id="out">
    <div class="wrap" style="padding:0">
      <p>Both of you join the same room, then open the episode on your own&nbsp;site.</p>
      <button id="create">Start a new room</button>
      <div class="row">
        <input id="code" maxlength="12" placeholder="Room code">
        <button class="ghost" id="join" style="flex:none">Join</button>
      </div>
    </div>
  </section>

  <section id="in" hidden>
    <div class="wrap" style="padding:0">
      <div class="card">
        <p>Room code - send it to your partner</p>
        <div class="row"><span class="roomcode" id="roomcode"></span><button class="ghost" id="copy" style="flex:none">Copy</button></div>
        <div class="status"><span class="dot" id="dot"></span><span id="status"></span></div>
        <div class="status"><span class="dot" id="vdot"></span><span id="vstatus"></span></div>
        <div class="status" id="syncrow" hidden><span class="dot" id="sdot"></span><span id="sstatus"></span></div>
      </div>
      <div class="card">
        <p>Still a bit off? Different intros or Bluetooth&nbsp;headphones.</p>
        <div class="nudge">
          <button class="ghost" data-step="-1">-1s</button>
          <button class="ghost" data-step="-0.1">-0.1</button>
          <b id="nudge">0 s</b>
          <button class="ghost" data-step="0.1">+0.1</button>
          <button class="ghost" data-step="1">+1s</button>
        </div>
        <p>Your video is behind - press&nbsp;+. Ahead - press&nbsp;-.</p>
      </div>
      <button class="ghost" id="leave">Leave room</button>
    </div>
  </section>

  <details>
    <summary>Server</summary>
    <input id="server" style="margin-top:8px" placeholder="https://watch-together-yzqa.onrender.com">
  </details>
</div>
<script src="popup.js"></script>
</body>
</html>
